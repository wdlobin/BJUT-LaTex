% 论文信息集中配置。封面、内封和声明页的个人信息都应在此修改。
% 公开模板只保留虚构占位内容；正式提交前请逐项与学校当年格式核对。
\makeatletter
\ez@def@key{clc}
\ez@def@key{secretlevel}
\ez@def@key{udc}
\ez@def@key{schoolcode}
\ez@def@key{ctitle}
\ez@def@key{etitle}
\ez@def@key{cauthor}
\ez@def@key{cdiscipline}
\ez@def@key{cmajor}
\ez@def@key{cdegree}
\ez@def@key{csupervisor}
\ez@def@key{csupervstitle}
\ez@def@key{ccollege}
\ez@def@key{cdate}
\ez@def@key{corganization}
\ez@def@key{studentid}
\ez@def@key{cheadertitle}
\ez@def@key{ccoverdegree}
\ez@def@key{ecoverdegree}
\ez@def@key{cinnertitle}
\ez@def@key{cstudytype}
\ez@def@key{authorsignature}
\ez@def@key{signaturedate}
\ez@def@key{supervisorsignature}
\ez@def@key{supervisorsignaturedate}
\makeatother

% 学位类型说明：下方默认值为专业学位（专硕）样例。
% 切换为学术学位（学硕）时，至少需要联动修改以下字段：
%   cdiscipline   = {学科专业名称}
%   cdegree       = {工学硕士学位}      % 按实际学位门类修改
%   cheadertitle  = {北京工业大学硕士学位论文}
%   ccoverdegree  = {硕\hspace{0.9em}士\hspace{0.9em}学\hspace{0.9em}位\hspace{0.9em}论\hspace{0.9em}文}
%   ecoverdegree  = {MASTER DISSERTATION}
%   cinnertitle   = {北京工业大学工学硕士学位论文} % “工学”按实际门类修改
%   cstudytype    = {}                    % 学硕内封通常不显示学习形式
% 学硕外封颜色、校徽和字段标签还需参照 bjutthesis.cls 中的切换注释调整。

\ezsetkeys{
  % 分类号、UDC 和学校代码显示在封面；分类号应按论文主题查询后填写。
  clc                     = {TP391},
  secretlevel             = {公开},
  udc                     = {004},
  schoolcode              = {10005},
  % 中英文题目应语义一致；etitle 会在内封中自动转为大写。
  ctitle                  = {北京工业大学学位论文LaTex模板},
  etitle                  = {LaTex template for dissertations of BJUT},
  cauthor                 = {张三},
  cdiscipline             = {专业类别或领域},
  cmajor                  = {论文排版与科技写作},
  cdegree                 = {硕士专业学位},
  csupervisor             = {李四},
  csupervstitle           = {教授},
  ccollege                = {XX学院},
  cdate                   = {202X年X月},
  corganization           = {北京工业大学},
  studentid               = {S202XXXXXX},
  cheadertitle            = {北京工业大学硕士专业学位论文},
  ccoverdegree            = {硕\hspace{0.45em}士\hspace{0.45em}专\hspace{0.45em}业\hspace{0.45em}学\hspace{0.45em}位\hspace{0.45em}论\hspace{0.45em}文},
  ecoverdegree            = {PROFESSIONAL MASTER DISSERTATION},
  cinnertitle             = {北京工业大学硕士专业学位论文},
  cstudytype              = {（全日制）},
  % 声明页签名默认留空，便于打印后手写。
  authorsignature         = {},
  signaturedate           = {\hspace{1em}年\hspace{1em}月\hspace{1em}日},
  supervisorsignature     = {},
  supervisorsignaturedate = {\hspace{1em}年\hspace{1em}月\hspace{1em}日}
}
